# Production scheduling and notifications run only on AWS Lambda + EventBridge.
# This GitHub Actions workflow is intentionally disabled so it does not send
# duplicate ntfy/email alerts.
#
# To re-enable as an emergency fallback, restore schedule crons and the
# scraper/recommender steps from git history — do not run both paths at once.

name: Indian Swing Trading Pipeline (disabled)

on:
  # No schedule — AWS owns live runs/notifications.
  # Manual runs also disabled to avoid accidental duplicate alerts.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE only if you intentionally want a local GHA run"
        required: true
        default: ""

jobs:
  disabled:
    if: github.event.inputs.confirm == 'ENABLE'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse by default
        run: |
          echo "GitHub Actions notifications are disabled."
          echo "Use AWS Lambda (invoke_aws.py / EventBridge) for alerts."
          exit 1
